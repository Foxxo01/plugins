name: Build and deploy

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Prepare environment
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install --global pnpm

      - name: Install deps
        run: pnpm i

      - name: Build plugin(s)
        run: node ./build.mjs

      - name: Copy additional files
        run: |
          cp README.md dist/README.md 2>/dev/null || true
          printf -- "markdown: GFM\n" > dist/_config.yml
          printf -- "---\npermalink: /404.html\n---\n" > dist/404.md
          printf -- "> **Note:** You accessed a link that returned a 404.\n\n" >> dist/404.md
          cat README.md >> dist/404.md 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
