name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Prepare environment
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - run: npm install --global pnpm

      - name: Install deps
        run: pnpm install

      - name: Build plugin(s)
        run: node ./build.mjs

      - name: Verify build output
        id: check-dist
        run: |
          if [ -d "./dist" ] && [ "$(ls -A dist)" ]; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi

      - name: Copy additional files
        if: steps.check-dist.outputs.exists == 'true'
        run: |
          cp README.md dist/README.md || true
          printf -- "markdown: GFM\n" > dist/_config.yml || true
          printf -- "---\npermalink: /404.html\n---\n" > dist/404.md || true
          printf -- "> **Note:** You accessed a link that returned a 404, probably by clicking one of the plugin links. You're supposed to copy the link address and add it into Vendetta.\n[...]\n" >> dist/404.md || true
          cat README.md >> dist/404.md || true

      - name: Deploy to GitHub Pages
        if: steps.check-dist.outputs.exists == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: true
